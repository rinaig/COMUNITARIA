name: Supabase DB Push

on:
  push:
    branches:
      - main
    paths:
      - supabase/**
      - .github/workflows/supabase-db-push.yml
  workflow_dispatch:

jobs:
  db-push:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: xzvrvjfbdhznfrriqepj

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check deployment credentials
        id: creds
        run: |
          missing=false

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Falta el secret SUPABASE_ACCESS_TOKEN en GitHub Actions. Se omite el db push remoto."
            missing=true
          fi

          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Falta el secret SUPABASE_DB_PASSWORD en GitHub Actions. Se omite el db push remoto."
            missing=true
          fi

          if [ "$missing" = true ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Link Supabase project
        if: steps.creds.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push database changes
        if: steps.creds.outputs.ready == 'true'
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Explain skipped db push
        if: steps.creds.outputs.ready != 'true'
        run: echo "Supabase DB Push omitido porque GitHub Actions todavia no tiene SUPABASE_ACCESS_TOKEN y/o SUPABASE_DB_PASSWORD configurados."
